name: SmartTube ✦ sync upstream

# Daily: replay the fork's commits on top of upstream's latest STABLE release and, if anything changed, build a release.
# A rebase conflict fails this job (GitHub emails you); fix it locally and push the branch.
# Scheduled runs need "declickbait" to be the fork's default branch.

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: declickbait
          fetch-depth: 0

      - name: Rebase on the latest upstream stable release
        id: rebase
        # Upstream tags stable releases "NN.NNs" (e.g. 32.71s); master runs ahead as beta. Follow stable only.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/yuliskov/SmartTube.git
          git fetch -q upstream --tags --force
          STABLE_TAGS="$(git tag -l '[0-9]*.[0-9]*s' | sort -V)"
          NEW="$(echo "$STABLE_TAGS" | tail -1)"
          if git merge-base --is-ancestor "$NEW" HEAD; then
            echo "Already on the latest stable release ($NEW)."
            exit 0
          fi
          # The stable tag this branch currently sits on: replay only our commits from there.
          OLD=""
          for t in $(echo "$STABLE_TAGS" | sort -Vr); do
            if git merge-base --is-ancestor "$t" HEAD; then OLD="$t"; break; fi
          done
          if [ -z "$OLD" ]; then
            echo "::error::Can't tell which stable release declickbait is based on."
            exit 1
          fi
          echo "Moving from $OLD to $NEW"
          git rebase --onto "$NEW" "$OLD"
          git push --force-with-lease origin HEAD:declickbait

      - name: Build a release if the published one is behind
        env:
          GH_TOKEN: ${{ github.token }}
          # The previous step adds an "upstream" remote, and gh would otherwise target yuliskov/SmartTube.
          GH_REPO: ${{ github.repository }}
        # Compares against what's actually published, so a rerun recovers if an earlier build never started.
        # Pushes made with GITHUB_TOKEN don't trigger workflows, so start the build explicitly.
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          PUBLISHED="$(gh release view latest-declick --json body --jq .body 2>/dev/null | grep -oE '[0-9a-f]{40}' | tail -1 || true)"
          if [ "$PUBLISHED" = "$HEAD_SHA" ]; then
            echo "Release already built from $HEAD_SHA."
          elif gh run list --workflow declick-build.yml --branch declickbait --json headSha,status \
                 --jq ".[] | select(.headSha == \"$HEAD_SHA\" and .status != \"completed\")" | grep -q .; then
            echo "A release build for $HEAD_SHA is already running."
          else
            gh workflow run declick-build.yml --ref declickbait
          fi
