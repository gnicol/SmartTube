name: SmartTube ✦ release

# Builds the side-by-side "declick" APKs, signs them with the fork's key and publishes them,
# plus the update feed the app checks, as the moving "latest-declick" GitHub release.

on:
  push:
    branches: [ declickbait ]
    # Docs and session notes don't need a release (and an update prompt on every TV).
    paths-ignore:
      - '**.md'
      - '.trail/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: declick-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode signing key
        env:
          DECLICK_KEYSTORE_B64: ${{ secrets.DECLICK_KEYSTORE_B64 }}
        run: |
          if [ -z "$DECLICK_KEYSTORE_B64" ]; then
            echo "::error::Add the DECLICK_* repository secrets first (see DECLICKBAIT.md)."
            exit 1
          fi
          echo "$DECLICK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/declick.jks"

      - name: Build
        env:
          DECLICK_KEYSTORE: ${{ runner.temp }}/declick.jks
          DECLICK_STORE_PASSWORD: ${{ secrets.DECLICK_STORE_PASSWORD }}
          DECLICK_KEY_ALIAS: ${{ secrets.DECLICK_KEY_ALIAS }}
          DECLICK_KEY_PASSWORD: ${{ secrets.DECLICK_KEY_PASSWORD }}
          DECLICK_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStstableDeclick --no-daemon

      - name: Prepare release files
        id: files
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OUT=smarttubetv/build/outputs/apk/ststable/declick
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a x86 universal; do
            cp "$OUT"/SmartTube_stable_*_"$abi".apk "dist/smarttube_declick_$abi.apk"
          done
          VERSION_NAME="$(jq -r '.elements[0].versionName' "$OUT/output-metadata.json")-declick.$RUN_NUMBER"
          VERSION_CODE="$(jq -r '.elements[0].versionCode' "$OUT/output-metadata.json")"
          BASE="https://github.com/$REPO/releases/download/latest-declick"
          jq -n --arg base "$BASE" --arg name "$VERSION_NAME" --argjson code "$VERSION_CODE" \
                --arg log "$(git log -1 --pretty=%s)" '{
            package: {
              downloadUrlList: [$base + "/smarttube_declick_armeabi-v7a.apk"],
              "downloadUrlList_armeabi-v7a": [$base + "/smarttube_declick_armeabi-v7a.apk"],
              "downloadUrlList_arm64-v8a": [$base + "/smarttube_declick_arm64-v8a.apk"],
              "downloadUrlList_x86": [$base + "/smarttube_declick_x86.apk"]
            },
            ($name): { versionCode: $code, changelog: [$log] }
          }' > dist/smarttube_declick.json
          cat dist/smarttube_declick.json
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.files.outputs.name }}
        # Replace assets in place instead of deleting the release first, so a failed upload never leaves the
        # installed apps without an update feed. APKs go up before the feed that points at them.
        run: |
          set -euo pipefail
          NOTES="Side-by-side SmartTube build with the ✦ de-clickbait button. Install smarttube_declick_armeabi-v7a.apk on Fire TV; the app updates itself from this release. Built from $GITHUB_SHA."
          if ! gh release view latest-declick >/dev/null 2>&1; then
            gh release create latest-declick --title "SmartTube ✦ $NAME" --target "$GITHUB_SHA" --notes "$NOTES"
          fi
          gh release upload latest-declick dist/*.apk --clobber
          gh release upload latest-declick dist/smarttube_declick.json --clobber
          gh release edit latest-declick --title "SmartTube ✦ $NAME" --notes "$NOTES"
